services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ledger_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/ledger.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ledger_data:
